name: Publish npm

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'anghunk/cwd'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing 需要 npm CLI 11.5.1 以上，Node 22 自带的是 10.x
      - name: Update npm
        run: |
          npm install -g npm@11
          npm --version

      # 诊断用：打印 OIDC 身份声明，便于与 npm 的 Trusted Publisher 配置逐项比对
      - name: Show OIDC identity
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
          python3 -c "import base64,json,sys;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=2))" "$TOKEN" || true

      - name: Get local package info
        id: pkg
        working-directory: docs/widget
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Get npm published version
        id: npm
        run: |
          PUBLISHED_VERSION=$(npm view "${{ steps.pkg.outputs.name }}" version || echo "none")
          echo "version=$PUBLISHED_VERSION" >> $GITHUB_OUTPUT

      - name: Decide whether to publish
        id: decision
        run: |
          echo "local=${{ steps.pkg.outputs.version }}"
          echo "remote=${{ steps.npm.outputs.version }}"
          if [ "${{ steps.npm.outputs.version }}" = "none" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          elif [ "${{ steps.pkg.outputs.version }}" != "${{ steps.npm.outputs.version }}" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.decision.outputs.should_publish == 'true'
        working-directory: docs/widget
        run: npm install

      - name: Build widget
        if: steps.decision.outputs.should_publish == 'true'
        working-directory: docs/widget
        run: npm run build

      - name: Publish to npm
        if: steps.decision.outputs.should_publish == 'true'
        working-directory: docs/widget
        run: npm publish --access public
